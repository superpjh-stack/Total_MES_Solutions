[project]
name = "mescore"
version = "0.1.0"
description = "MES 표준플랫폼 — 코어 한 벌(mescore) + 업종 팩(packs/<팩>). lot + lot_genealogy 재귀 계보 · bas_process_param → pop_measure 측정값"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "itsdangerous>=2.2",
    "anthropic>=1.12.1",
    "pypdf>=6.20.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
markers = [
    "fn(function_id): 이 테스트가 검증하는 기능 ID (contracts/function-list.md) — G-C02 추적",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mescore", "src/mesagent", "src/meshub"]
