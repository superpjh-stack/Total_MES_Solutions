# 팩은 packs/<팩>/pack.yaml 로 이것을 덮어쓴다(app/packs.py 가 코어 → 팩 순으로 병합). 여기 적힌 수(12 · 51 · 5 · 4 · 48)는 게이트의 기대값이다.
