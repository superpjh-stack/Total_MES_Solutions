# ── 기능 수 밖 허용 라우트 (D-31) — function-list.md 에 없지만 코어가 등록하는 엔드포인트. tools/check_trace.py 가 G-C02 고아에서 뺀다. 메서드 · 경로는 라우터와 글자 그대로 ──
extra_routes:
  - { method: POST, path: "/pop/result/{id}/split", decision: D-12, note: 분할 — F-POP-03 계약 안의 LOT 생성 옵션 }
  - { method: POST, path: "/pop/result/{id}/merge", decision: D-12, note: 합병 — 〃 }
  - { method: GET, path: "/shp/shipments/{id}/label", decision: D-601, note: 출하 라벨 인쇄 (SHP-02 인쇄 버튼) }

# ── 역할 4 (D-08) ──
roles:
  - { code: ADMIN, name: 관리자 }
  - { code: PROD, name: 생산 }
  - { code: QA, name: 품질 }
  - { code: FIELD, name: 현장 }

# ── 권한 표 48칸 = 모듈 12 × 역할 4 (goal.md §6 그대로 · D-13). 값: 없음 | 조회 | 입력 | {level: 입력, scopes: [범위…]}
#    괄호 없는 `입력` 은 scopes [일반]. 괄호 조건은 **그 범위 기능만** 쓸 수 있다(일반 기능은 못 한다). 범위 이름은 function-list.md 의 `범위` 열과 같다
permissions:
  bas: { ADMIN: 입력, PROD: 조회, QA: 조회, FIELD: 없음 }
  ord: { ADMIN: 입력, PROD: 입력, QA: 조회, FIELD: 조회 }
  job: { ADMIN: 입력, PROD: 입력, QA: 조회, FIELD: 조회 }
  mat: { ADMIN: 조회, PROD: 입력, QA: { level: 입력, scopes: [입고검사] }, FIELD: 입력 }
  pop: { ADMIN: 조회, PROD: 입력, QA: 조회, FIELD: 입력 }
  qua: { ADMIN: 조회, PROD: 조회, QA: 입력, FIELD: 조회 }
  eqp: { ADMIN: 조회, PROD: 입력, QA: 조회, FIELD: 입력 }
  shp: { ADMIN: { level: 입력, scopes: [승인] }, PROD: 입력, QA: 조회, FIELD: 입력 }
  trc: { ADMIN: 조회, PROD: 조회, QA: 조회, FIELD: 없음 }
  kpi: { ADMIN: { level: 입력, scopes: [지표] }, PROD: 조회, QA: 조회, FIELD: 조회 }
  sys: { ADMIN: 입력, PROD: 없음, QA: 없음, FIELD: 없음 }
  ifc: { ADMIN: { level: 입력, scopes: [재전송] }, PROD: 조회, QA: 없음, FIELD: 없음 }
scope_general: 일반
scopes: [일반, 입고검사, 승인, 지표, 재전송]

# ── 채번 종류 8 (interfaces.md §3) · 기본 형식 D-10 · 접두어 D-16. sys_number_rule 시드의 출처. 팩 numbering 이 덮어쓴다 ──
numbering:
  WORK_ORDER: { prefix: W, date: YYMMDD-, digits: 3, label: 작업지시 번호 }
  LOT_MATERIAL: { prefix: M, date: YYMMDD-, digits: 4, label: 원재료 LOT 번호 }
  LOT_PRODUCT: { prefix: P, date: YYMMDD-, digits: 4, label: 생산 LOT 번호 }
  LOT_SHIPMENT: { prefix: X, date: YYMMDD-, digits: 4, label: 출하 LOT 번호 }
  SHIPMENT: { prefix: S, date: YYMMDD-, digits: 3, label: 출하 번호 }
  DOCUMENT: { prefix: C, date: YYMMDD-, digits: 3, label: 성적서 번호 }
  ORDER: { prefix: O, date: YYMMDD-, digits: 3, label: 수주 번호 }
  PLAN: { prefix: N, date: YYMMDD-, digits: 3, label: 생산계획 번호 }
  ISSUE: { prefix: Q, date: YYMMDD-, digits: 3, label: 이상 번호 }       # D-202 (qua_issue.issue_no · 개발2 요청)

# ── 계보 (spec.md §2.4 · §3.6) — LOT 종류 3 · 관계 5 · 상태 표시어. 팩은 base 로 귀속되는 종류 · 관계를 더한다 ──
lineage:
  lot_kinds:
    - { kind: MATERIAL, base: MATERIAL, label: 원재료 LOT }
    - { kind: PRODUCT, base: PRODUCT, label: 생산 LOT }
    - { kind: SHIPMENT, base: SHIPMENT, label: 출하 LOT }
  relations:
    - { name: 투입, base: 투입 }
    - { name: 생산, base: 생산 }
    - { name: 분할, base: 분할 }
    - { name: 합병, base: 합병 }
    - { name: 출하, base: 출하 }
  states: { IN_STOCK: 재고, CONSUMED: 소진, SHIPPED: 출하 }

# ── 채널별 화면 (screens[].channels 에서 뽑은 것 — 팩 channels 가 통째로 대체). web 은 전 화면 ──
