  pop: [MAT-01, MAT-02, MAT-03, POP-01, POP-02, POP-03, POP-04, QUA-02, EQP-01, EQP-02, EQP-03, SHP-01, SHP-02]
  mobile: [ORD-03, JOB-02, MAT-04, SHP-03, TRC-01, TRC-02, TRC-03, KPI-02]
  board: [KPI-01]

# ── 용어 사전 키 — 코어 중립어 26 (spec.md §12). 팩 terms 의 키는 이 안에 있어야 한다(R6) ──
terms_keys: [품목, BOM, 공정, 설비, 거래처, 작업자, 수주, 생산계획, 작업지시, 원재료 LOT, 생산 LOT, 출하 LOT, 실적,
             작업 시작, 작업 종료, 투입, 측정값, 검사, 불량, 이상, 출하, 성적서, 추적, 현황판, 분할, 합병]

# ── 금지어 (spec.md §12 전체) — tools/check_terms.py 가 src/mescore/ 에서 찾으면 G-C23 FAIL. 이 블록 자체는 검사에서 뺀다 ──
forbidden_terms:
  김치: [절임, 절임통, 염도, 숙성, 양념, 버무림, 금속검출, 소독수, 세척, 탈수, 김치, 율무, 아이스박스]
  급식: [솥, 인분, 식수, 검식, 레시피, 조리, 취사, 볶음, 무침, 급식, 교반]
  인쇄필름: [Roll, 롤, Job, 판사양, 아니록스, 잉크, 조색, 배합비, ΔE, 후가공, 슬리팅, splice, COA]
  타월: [DTF, 나염, 승화, 전사, 타월, 수건, 자수]
# spec.md §12 의 `메뉴(음식 뜻)` — 음식 뜻으로만 금지. 화면 메뉴의 `메뉴` 는 코어가 쓴다 (D-22). 검사하지 않는다
forbidden_terms_notes:
  급식: [메뉴(음식 뜻)]

# ── 공통코드 코어 그룹 (db-schema.md bas_code) — 시드가 is_core='Y' 로 넣는다. 코드 추가는 가능, 코어 코드 삭제는 422 (F-BAS-35) ──
code_groups:
  ITEM_TYPE: { name: 품목 구분, codes: [제품, 반제품, 원재료, 부자재] }
  PARTNER_TYPE: { name: 거래처 구분, codes: [고객, 공급, 외주] }
  STOP_REASON: { name: 정지 사유, codes: [{ code: ETC, name: 기타 (예시) }] }   # D-15
  INSP_TYPE: { name: 검사 유형, codes: [입고, 공정, 최종] }
  JUDGEMENT: { name: 판정, codes: [합격, 불합격, 조건부] }
  EQUIP_STATE: { name: 설비 상태, codes: [가동, 정지, 점검, 고장] }
